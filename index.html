
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Flight Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <h2>ULTIMATE FLIGHT SIMULATOR</h2>
    
<div id="instruments">
  <div id="speed">0 kt</div>
<div id="altitude">0 ft</div>
<div id="throttle">35%</div>
<div id="heading">0°</div>
<div id="vertical">0 ft/min</div>
<div id="gear">DOWN</div>
<div id="flaps">UP</div>
</div>

  </div>

  
<div id="controls">
  W/S: Pitch | A/D: Roll | Q/E: Rudder |
  ↑/↓: Throttle | G: Gear | F: Flaps |
  C: Camera | R: Reset
</div>


  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
